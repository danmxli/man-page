site_name: Muxing Li
site_url: https://muxing.info/
site_description: Engineer portfolio of Muxing Li, containing education, experience, projects, and contact info.
site_author: Muxing Li

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: muxing_favicon_1/favicon-32x32.png
  favicon: muxing_favicon_1/favicon.ico
  font: false
  features:
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md

plugins:
  - search

markdown_extensions:
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/danli591/
      name: Muxing Li on LinkedIn
    - icon: fontawesome/brands/github
      link: https://github.com/danmxli
      name: Muxing Li on GitHub
